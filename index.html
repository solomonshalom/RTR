<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotaract Report Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   0.  TOKENS
   ==========================================================================*/
:root{
  /* Rotaract brand */
  --cranberry:#D41367;
  --royal:#17458F;
  --azure:#0067C8;
  --gold:#F7A81B;
  --violet:#872175;
  --ink:#0C1730;
  --slate:#4A5878;
  --slate-2:#7C88A3;
  --paper:#FFFFFF;
  --paper-2:#F6F8FC;
  --hair:#E3E8F1;

  /* macOS / Notes UI */
  --ui-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --ui-bg:#FFFFFF;
  --ui-side:#F4F4F1;
  --ui-side-2:#EDEDEA;
  --ui-line:#E0E0DC;
  --ui-text:#1D1D1F;
  --ui-dim:#8A8A8F;
  --ui-dim-2:#A5A5AA;
  --ui-sel:#DFDEDA;
  --ui-note-sel:#FFE08A;
  --ui-accent:#E5A200;
  --ui-accent-soft:#FFF3D2;
  --radius:10px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--ui-font);
  font-size:14px;
  color:var(--ui-text);
  background:#E9E9E6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:#FFE08A}

/* ============================================================================
   1.  APP SHELL  —  Apple Notes chrome
   ==========================================================================*/
.app{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:auto auto 1fr;
  grid-template-columns:minmax(0,1fr);
  background:var(--ui-bg);
}

/* --- mobile pane bar (hidden until the narrow breakpoint) -------------- */
.mnav{display:none;align-items:center;gap:8px;height:42px;padding:0 10px;
  background:var(--ui-side);border-bottom:1px solid var(--ui-line);user-select:none}
.mnav-back{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 9px 0 5px;
  border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ui-accent);
  flex:0 1 auto;min-width:0;max-width:45%;white-space:nowrap}
.mnav-back svg{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mnav-back span{overflow:hidden;text-overflow:ellipsis}
.mnav-back:active{background:rgba(0,0,0,.05)}
.mnav-back[hidden]{display:none}
.mnav-title{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:2px}

/* --- toolbar ---------------------------------------------------------- */
.toolbar{
  height:52px;display:flex;align-items:center;gap:14px;min-width:0;
  padding:0 14px 0 14px;
  background:linear-gradient(180deg,#FAFAF8,#F2F2EF);
  border-bottom:1px solid var(--ui-line);
  user-select:none;
}
.lights{display:flex;gap:8px;margin-right:4px}
.light{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.light.r{background:#FF5F57}.light.y{background:#FEBC2E}.light.g{background:#28C840}

.tb-title{
  display:flex;align-items:center;gap:9px;min-width:0;
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;
}
.tb-title .tb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-title .dot{
  width:20px;height:20px;flex:0 0 20px;border-radius:6px;
  background:linear-gradient(150deg,#FFD84D,#F5B921);
  display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.tb-title .dot svg{width:12px;height:12px;fill:#8A5B00}
.tb-title small{color:var(--ui-dim);font-weight:500}

.tb-spacer{flex:1}
.warnchip{
  font-size:11.5px;font-weight:600;color:#8A5A00;background:#FFF3D2;
  padding:4px 9px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(200,160,40,.35);
  white-space:nowrap;cursor:default;
}

.seg{
  display:flex;flex:0 0 auto;background:#E6E6E2;border-radius:8px;padding:2px;gap:2px;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);
}
.seg button{
  padding:4px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:#4A4A4E;
  transition:background .12s,box-shadow .12s;
}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.13)}

.tbtn{
  display:inline-flex;flex:0 0 auto;align-items:center;gap:6px;
  height:29px;padding:0 12px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:#33333A;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.10),inset 0 0 0 .5px rgba(0,0,0,.10);
  transition:background .12s,transform .06s;
}
.tbtn:hover{background:#FAFAF8}
.tbtn:active{transform:translateY(.5px)}
.tbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbtn.primary{
  background:linear-gradient(180deg,#FFCF3D,#F2AE05);
  color:#3B2600;box-shadow:0 1px 2px rgba(180,130,0,.35),inset 0 0 0 .5px rgba(140,100,0,.3);
}
.tbtn.primary:hover{filter:brightness(1.04)}
.tb-zoom{display:flex;flex:0 0 auto;align-items:center;gap:2px;background:#fff;border-radius:8px;padding:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.10),inset 0 0 0 .5px rgba(0,0,0,.10)}
.tb-zoom button{width:25px;height:25px;border-radius:6px;font-size:14px;color:#4A4A4E;display:grid;place-items:center}
.tb-zoom button:hover{background:#F0F0EC}
.tb-zoom span{font-size:11.5px;font-weight:600;color:var(--ui-dim);min-width:38px;text-align:center}

/* --- body columns ------------------------------------------------------ */
.main{display:grid;grid-template-columns:206px 268px 1fr;min-height:0;overflow:hidden}
.main.preview{grid-template-columns:206px 1fr}
.main.preview .col-list{display:none}

/* --- sidebar ----------------------------------------------------------- */
.col-side{
  background:var(--ui-side);border-right:1px solid var(--ui-line);
  padding:10px 9px;overflow-y:auto;user-select:none;
}
.side-h{
  font-size:11px;font-weight:700;color:var(--ui-dim-2);letter-spacing:.04em;
  padding:10px 8px 6px;text-transform:uppercase;
}
.side-item{
  display:flex;align-items:center;gap:9px;
  padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:13.5px;font-weight:500;color:#2A2A2E;
  transition:background .1s;
}
.side-item:hover{background:rgba(0,0,0,.045)}
.side-item.on{background:var(--ui-sel)}
.side-item .ic{width:17px;height:17px;flex:0 0 17px;display:grid;place-items:center}
.side-item .ic svg{width:15px;height:15px;fill:none;stroke:var(--ui-accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .c{font-size:11.5px;color:var(--ui-dim-2);font-weight:600}
.side-lock{width:11px;height:11px;stroke:var(--ui-dim-2);fill:none;stroke-width:1.8}

.side-foot{margin-top:14px;padding:10px 8px 4px;border-top:1px solid var(--ui-line)}
.side-foot button{
  display:flex;width:100%;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;
  font-size:12.5px;color:#3A3A3E;
}
.side-foot button:hover{background:rgba(0,0,0,.05)}
.side-foot svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.6}

/* --- notes list -------------------------------------------------------- */
.col-list{
  background:#FBFBF9;border-right:1px solid var(--ui-line);
  display:flex;flex-direction:column;min-height:0;
}
.list-top{
  padding:10px 12px 8px;border-bottom:1px solid var(--ui-line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.list-top h2{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#3A3A3E;text-transform:uppercase}
.list-add{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.10),inset 0 0 0 .5px rgba(0,0,0,.10);
}
.list-add svg{width:13px;height:13px;stroke:var(--ui-accent);stroke-width:2.2;fill:none;stroke-linecap:round}
.list-scroll{flex:1;overflow-y:auto;padding:6px}
.note-row{
  position:relative;display:flex;gap:9px;align-items:flex-start;
  padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;
  transition:background .1s;
}
.note-row:hover{background:rgba(0,0,0,.035)}
.note-row.on{background:var(--ui-note-sel)}
.note-row .body{flex:1;min-width:0}
.note-row .t,.note-row .s{display:block}
.note-row .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row .s{font-size:11.5px;color:var(--ui-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row.on .s{color:#8A6A10}
.note-row .thumb{
  width:34px;height:34px;border-radius:6px;flex:0 0 34px;object-fit:cover;
  background:#EDEDE9;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1);
}
.note-row .num{
  width:24px;height:24px;border-radius:6px;flex:0 0 24px;display:grid;place-items:center;
  background:rgba(0,0,0,.055);font-size:11px;font-weight:800;color:var(--cranberry);letter-spacing:-.02em;
}
.note-row .row-acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.note-row:hover .row-acts{opacity:1}
.row-acts button{
  width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--ui-dim);
}
.row-acts button:hover{background:rgba(0,0,0,.09);color:#333}
.row-acts svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list-empty{padding:26px 16px;text-align:center;color:var(--ui-dim-2);font-size:12.5px;line-height:1.5}

/* --- editor ------------------------------------------------------------ */
.col-edit{overflow-y:auto;background:#fff;min-height:0}
.sheet{max-width:640px;margin:0 auto;padding:34px 40px 120px}
.sheet-date{font-size:11.5px;color:var(--ui-dim-2);text-align:center;margin-bottom:16px;font-weight:500}
.sheet h1{
  margin:0 0 4px;font-size:25px;font-weight:700;letter-spacing:-.022em;line-height:1.2;
}
.sheet .sub{color:var(--ui-dim);font-size:13px;margin:0 0 24px;line-height:1.5}

.fgroup{margin-bottom:19px}
.fgroup > label,.flabel{
  display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ui-dim-2);margin-bottom:6px;
}
.hint{font-size:11.5px;color:var(--ui-dim-2);margin-top:5px;line-height:1.45}
.hint code{background:#F2F2EE;padding:1px 4px;border-radius:3px;font-size:11px}

.fld{
  width:100%;display:block;padding:9px 11px;border-radius:8px;
  background:#F7F7F4;border:1px solid transparent;
  font-size:14px;line-height:1.5;color:var(--ui-text);
  transition:background .12s,border-color .12s,box-shadow .12s;
  resize:none;
}
.fld:focus{outline:none;background:#fff;border-color:#EBCB6A;box-shadow:0 0 0 3px rgba(245,185,33,.18)}
.fld::placeholder{color:#B6B6BA}
textarea.fld{min-height:82px;line-height:1.6}
.fld.big{font-size:19px;font-weight:700;letter-spacing:-.015em;padding:11px}
.fld.mono-up{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow.three{grid-template-columns:1fr 1fr 1fr}
select.fld{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 4.5 6 7.5 9 4.5' fill='none' stroke='%238A8A8F' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:28px}

/* segmented layout chooser */
.chooser{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.chooser button{
  border-radius:9px;padding:9px 6px 8px;background:#F7F7F4;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:10.5px;font-weight:600;color:#55555A;letter-spacing:.01em;
  transition:background .12s,box-shadow .12s;
}
.chooser button:hover{background:#F1F1EC}
.chooser button.on{background:var(--ui-accent-soft);box-shadow:inset 0 0 0 1.5px #E9BE4A;color:#7A5400}
.chooser .gfx{width:100%;height:26px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);
  display:flex;gap:2px;padding:3px;overflow:hidden}
.chooser .gfx i{display:block;border-radius:2px;background:#DDDDD8}
.chooser .gfx i.img{background:#BFCBE0}
.chooser .gfx i.t{background:#E4E4DF}

/* image drop */
.drop{
  border:1.5px dashed #DCDCD6;border-radius:11px;background:#FAFAF7;
  padding:20px;text-align:center;cursor:pointer;transition:border-color .14s,background .14s;
}
.drop:hover,.drop.over{border-color:#EFC65C;background:#FFFBEF}
.drop svg{width:22px;height:22px;stroke:#C0C0BA;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.drop .l1{font-size:13px;font-weight:600;color:#55555A}
.drop .l2{font-size:11.5px;color:var(--ui-dim-2);margin-top:2px}

.imgcard{border-radius:11px;overflow:hidden;background:#F7F7F4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.imgcard img{width:100%;display:block;max-height:230px;object-fit:cover;background:#E9E9E4}
.imgcard .bar{display:flex;align-items:center;gap:7px;padding:8px 9px}
.imgcard .bar .grow{flex:1;min-width:0}
.mini{
  height:26px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:#4A4A4E;
  background:#fff;box-shadow:0 1px 1.5px rgba(0,0,0,.09),inset 0 0 0 .5px rgba(0,0,0,.11);
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.mini:hover{background:#FAFAF8}
.mini.danger{color:#C0392B}
.mini svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
select.mini{appearance:none;padding-right:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 5 6 8 9 5' fill='none' stroke='%238A8A8F' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;background-color:#fff}

/* repeaters (stats, credits, gallery) */
.rep{display:flex;flex-direction:column;gap:8px}
.rep-row{display:flex;gap:8px;align-items:center;background:#F7F7F4;border-radius:9px;padding:8px}
.rep-row .fld{background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.09)}
.rep-row .handle{color:#C4C4BE;cursor:grab;padding:0 2px;font-size:14px;line-height:1}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gal-item{border-radius:9px;overflow:hidden;background:#F2F2EE;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);position:relative}
.gal-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gal-item input{width:100%;border:0;background:#fff;padding:6px 7px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:#4A4A4E}
.gal-item input:focus{outline:none;background:#FFFBEF}
.gal-item .x{position:absolute;top:5px;right:5px;width:21px;height:21px;border-radius:50%;
  background:rgba(20,20,22,.62);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.gal-item .x svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.gal-item .pos{position:absolute;top:5px;left:5px}
.gal-item select{border:0;background:rgba(20,20,22,.62);color:#fff;border-radius:6px;font-size:9.5px;
  font-weight:700;padding:3px 5px;backdrop-filter:blur(6px);appearance:none;letter-spacing:.04em}

/* logos list */
.logo-list{display:flex;flex-direction:column;gap:8px}
.logo-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
  background:#F7F7F4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.055);
}
.logo-item .prev{
  width:92px;height:44px;flex:0 0 92px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(150deg,#12275C,#17458F);padding:6px;
}
.logo-item .prev img{max-width:100%;max-height:100%;object-fit:contain}
.logo-item .meta{flex:1;min-width:0}
.logo-item .meta .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-item .meta .r{font-size:11.5px;color:var(--ui-dim-2);margin-top:2px}
.badge-lock{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:#8A6A10;background:var(--ui-accent-soft);
  padding:3px 7px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(200,160,40,.3);
}
.badge-lock svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2.2}

.callout{
  display:flex;gap:10px;padding:11px 13px;border-radius:10px;
  background:#FFFBEF;box-shadow:inset 0 0 0 1px rgba(220,180,60,.32);
  font-size:12.5px;line-height:1.5;color:#6E5410;margin-bottom:20px;
}
.callout svg{width:15px;height:15px;flex:0 0 15px;stroke:#C79A17;fill:none;stroke-width:1.9;margin-top:1px;stroke-linecap:round;stroke-linejoin:round}
.callout b{color:#5A4409}

.divider{height:1px;background:var(--ui-line);margin:26px 0 22px}
.sec-title{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:#3A3A3E;margin:0 0 12px;text-transform:uppercase}

/* ============================================================================
   2.  PREVIEW CANVAS
   ==========================================================================*/
.col-prev{
  overflow:auto;background:#E4E5E9;min-height:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.045) 1px,transparent 0);
  background-size:22px 22px;
}
#pages{padding:26px 20px 60px;display:flex;flex-direction:column;align-items:center}
.paper{
  width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.14),0 12px 34px rgba(16,24,40,.16);
  transform-origin:top center;
  flex:0 0 auto;
}
.pagemark{
  font-size:11px;font-weight:600;color:#8B8F98;letter-spacing:.05em;text-transform:uppercase;
  margin:0 0 7px;
}
.prev-warn{
  max-width:210mm;margin:0 auto 14px;padding:10px 14px;border-radius:9px;
  background:#FFF4E5;color:#8A5A00;font-size:12.5px;line-height:1.5;
  box-shadow:inset 0 0 0 1px rgba(200,140,20,.3);
}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,22,28,.34);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:80;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:440px;max-width:calc(100vw - 40px);background:#fff;border-radius:14px;padding:24px;
  box-shadow:0 24px 70px rgba(0,0,0,.32);animation:pop .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.015em}
.modal p{margin:0 0 14px;font-size:13px;color:#5A5A60;line-height:1.55}
.modal ol{margin:0 0 18px;padding-left:18px;font-size:13px;color:#3A3A40;line-height:1.85}
.modal ol b{color:#111}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .acts .tbtn{height:32px;padding:0 15px}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:rgba(28,28,32,.94);color:#fff;padding:9px 16px;border-radius:9px;
  font-size:12.5px;font-weight:500;z-index:90;box-shadow:0 8px 26px rgba(0,0,0,.3);
  animation:pop .18s ease;
}
.hidden{display:none !important}
/* ============================================================================
   3.  THE REPORT  —  A4 print design
   ==========================================================================*/
.paper,.paper *{
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.paper{
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  --mx:15mm;
  --accent:var(--cranberry);
  --deep:#0B1533;
  --deep2:#16306B;
  --deep3:#17458F;
}
.paper.t-cranberry{--accent:#D41367;--deep:#2A0620;--deep2:#6E0C3B;--deep3:#B01059}
.paper.t-midnight {--accent:#F7A81B;--deep:#070C1B;--deep2:#101C3A;--deep3:#1B3060}
.paper.t-royal    {--accent:#D41367;--deep:#0B1533;--deep2:#16306B;--deep3:#17458F}

/* ---- shared atoms ----------------------------------------------------- */
.eyebrow{
  font-size:6.6pt;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--slate-2);
}
.rtxt p{margin:0 0 3.2mm;font-size:10.2pt;line-height:1.63;color:var(--slate);font-weight:400}
.rtxt p:last-child{margin-bottom:0}
.rtxt strong{color:var(--ink);font-weight:700}

.frame{
  position:relative;border-radius:3.2mm;overflow:hidden;background:#E9EDF4;
  box-shadow:0 .5mm 1.6mm rgba(12,23,48,.10),0 3mm 8mm rgba(12,23,48,.10);
}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .cap,.cover .hero .cap{
  position:absolute;left:0;right:0;bottom:0;padding:9mm 4mm 3.4mm;
  background:linear-gradient(to top,rgba(6,12,28,.86) 0%,rgba(6,12,28,.55) 45%,rgba(6,12,28,0) 100%);
  color:#fff;font-size:6.4pt;font-weight:700;letter-spacing:.11em;text-transform:uppercase;line-height:1.45;
}
.frame.ph{background:repeating-linear-gradient(135deg,#EEF1F7 0 6px,#E6EBF3 6px 12px)}
.frame.ph .ph-in{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;
  color:#9AA6BD;font-size:7pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.frame.ph .ph-in svg{width:8mm;height:8mm;stroke:#B4BFD2;fill:none;stroke-width:1.4}

/* ---- page furniture --------------------------------------------------- */
.pg-head{
  position:absolute;top:11mm;left:var(--mx);right:var(--mx);height:13mm;
  display:flex;align-items:center;justify-content:space-between;gap:6mm;overflow:hidden;
  border-bottom:.25mm solid var(--hair);
}
.pg-head .hl{font-size:6.4pt;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--slate-2)}
.pg-head .hl b{color:var(--accent);font-weight:800}
.pg-body{position:absolute;top:29.5mm;left:var(--mx);right:var(--mx);bottom:20mm;overflow:hidden}
.pg-foot{
  position:absolute;bottom:10mm;left:var(--mx);right:var(--mx);height:8mm;padding-top:2.6mm;
  border-top:.25mm solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;
  font-size:6.2pt;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--slate-2);
}
.pg-foot .pno{
  color:#fff;background:var(--accent);border-radius:50%;
  width:5.6mm;height:5.6mm;display:grid;place-items:center;font-size:6.4pt;letter-spacing:0;
}

/* logo lockup ----------------------------------------------------------- */
.lock{display:flex;align-items:center}
.lock img{display:block;object-fit:contain;height:calc(var(--lh) * var(--k,1));max-width:36mm}
.lock .sep{width:.25mm;height:calc(var(--lh) * .82);background:rgba(120,132,156,.40);flex:0 0 .25mm}
.lock.dark .sep{background:rgba(255,255,255,.32)}
.lock .chip{
  background:#fff;border-radius:1.3mm;padding:.9mm 1.4mm;display:flex;align-items:center;
  box-shadow:0 .3mm .9mm rgba(0,0,0,.16);
}
.lock .chip img{height:calc(var(--lh) * .74);max-width:30mm}
.lock--head {--lh:7mm;    gap:2.8mm}
.lock--cover{--lh:10.5mm; gap:4.2mm}
.lock--big  {--lh:12.5mm; gap:5mm}

/* ============================================================================
   4.  COVER
   ==========================================================================*/
.paper.cover{
  background:
    radial-gradient(120% 80% at 108% 4%,rgba(212,19,103,.30) 0%,rgba(212,19,103,0) 52%),
    radial-gradient(90% 70% at -12% 92%,rgba(0,103,200,.34) 0%,rgba(0,103,200,0) 58%),
    linear-gradient(158deg,var(--deep) 0%,var(--deep2) 52%,var(--deep3) 100%);
  color:#fff;
}
.cover .arc{position:absolute;border:.3mm solid rgba(255,255,255,.10);border-radius:50%}
.cover .arc.a1{width:200mm;height:200mm;right:-88mm;top:-52mm}
.cover .arc.a2{width:150mm;height:150mm;right:-64mm;top:-24mm;border-color:rgba(255,255,255,.07)}
.cover .arc.a3{width:120mm;height:120mm;left:-66mm;bottom:-40mm;border-color:rgba(255,255,255,.09)}
.cover .grain{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) .25mm,transparent .25mm);
  background-size:100% 4mm}

.cover .inner{position:absolute;inset:0;padding:15mm var(--mx) 15mm;display:flex;flex-direction:column}
.cover-lock{display:flex;justify-content:center;margin-bottom:13mm}
.cover .eyebrow{color:rgba(255,255,255,.68);margin-bottom:5.5mm}
.cover .eyebrow i{font-style:normal;color:var(--accent);margin:0 1.6mm}

.cover h1{
  margin:0;font-size:53pt;font-weight:800;line-height:.94;letter-spacing:-.035em;
  color:#fff;max-width:150mm;
}
.cover h1 .ac{color:var(--accent);position:relative;display:inline-block}
.cover h1 .ac::after{
  content:"";position:absolute;left:0;right:0;bottom:-1.4mm;height:1.1mm;
  background:var(--accent);border-radius:.6mm;
}
.cover .deck{
  margin:7mm 0 0;max-width:118mm;font-size:11pt;line-height:1.58;font-weight:400;
  color:rgba(255,255,255,.80);
}
.cover .byline{
  margin-top:7mm;display:flex;align-items:center;gap:4mm;flex-wrap:wrap;
  font-size:7.4pt;color:rgba(255,255,255,.62);font-weight:400;
}
.cover .byline b{color:#fff;font-weight:700}
.cover .byline .v{width:.25mm;height:3.4mm;background:rgba(255,255,255,.28)}

.cover .toc{display:grid;grid-template-columns:repeat(4,1fr);gap:5mm;margin-top:9mm}
.cover .toc .it{border-top:.5mm solid rgba(255,255,255,.30);padding-top:2.6mm}
.cover .toc .n{font-size:7.4pt;font-weight:800;color:var(--accent);letter-spacing:.06em}
.cover .toc .l{
  margin-top:1.6mm;font-size:6.2pt;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(255,255,255,.74);line-height:1.55;
}

.cover .hero{
  margin-top:9mm;position:relative;border-radius:3.6mm;overflow:hidden;
  flex:1 1 78mm;min-height:52mm;box-shadow:0 4mm 18mm rgba(0,0,0,.34);
  border:.4mm solid rgba(255,255,255,.12);
}
.cover .hero img{width:100%;height:100%;object-fit:cover;display:block}
.cover-foot{
  position:absolute;left:var(--mx);right:var(--mx);bottom:8mm;
  display:flex;align-items:center;justify-content:space-between;
  font-size:6.2pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.55);
}
.cover-foot b{color:rgba(255,255,255,.85);font-weight:700}

/* ============================================================================
   5.  CONTENT BLOCKS
   ==========================================================================*/
.blk + .blk{margin-top:8mm}

/* -- lead / highlight card -- */
.blk-lead{
  position:relative;overflow:hidden;border-radius:3.6mm;padding:9mm 10mm;
  background:linear-gradient(140deg,var(--deep) 0%,var(--deep2) 60%,var(--deep3) 100%);
  color:#fff;
}
.blk-lead .glow{position:absolute;width:70mm;height:70mm;border-radius:50%;right:-22mm;top:-30mm;
  background:radial-gradient(circle,rgba(212,19,103,.42),rgba(212,19,103,0) 68%)}
.blk-lead .arcl{position:absolute;border:.3mm solid rgba(255,255,255,.11);border-radius:50%;
  width:90mm;height:90mm;right:-30mm;bottom:-56mm}
.blk-lead .kt{
  position:relative;font-size:6.4pt;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3.5mm;
}
.blk-lead p{position:relative;margin:0 0 3mm;font-size:11.4pt;line-height:1.56;font-weight:500;color:rgba(255,255,255,.94)}
.blk-lead p:last-child{margin-bottom:0}

/* -- numbered section head -- */
.sechead{display:flex;align-items:center;gap:3mm;margin-bottom:3.6mm}
.sechead .no{font-size:13pt;font-weight:800;color:var(--accent);letter-spacing:-.02em;line-height:1}
.sechead .rule{width:9mm;height:.5mm;background:var(--accent);opacity:.5;border-radius:.3mm}
.sechead .kk{font-size:6.6pt;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--slate-2)}
.sec h2{
  margin:0 0 4mm;font-size:20.5pt;font-weight:800;line-height:1.08;letter-spacing:-.024em;color:var(--ink);
}

/* -- two column section -- */
.blk-sec{display:grid;gap:8mm;align-items:start}
.blk-sec.right{grid-template-columns:1fr 74mm}
.blk-sec.left {grid-template-columns:74mm 1fr}
.blk-sec.left .sec{order:2}
.blk-sec.left .figwrap{order:1}
.blk-sec .frame{aspect-ratio:4/3}
.blk-sec.tallimg .frame{aspect-ratio:3/4}

/* -- section continuation -- */
.blk-cont{columns:2;column-gap:8mm}
.blk-cont p{break-inside:avoid}

/* -- full-width feature -- */
.blk-feat .frame{aspect-ratio:16/9;width:100%}
.blk-feat .sec{margin-bottom:5mm}

/* -- quote -- */
.blk-quote{
  position:relative;overflow:hidden;border-radius:3.6mm;padding:10mm 14mm 9mm;text-align:center;
  background:linear-gradient(140deg,var(--deep) 0%,var(--deep2) 55%,var(--deep3) 100%);
  color:#fff;
}
.blk-quote .glow{position:absolute;width:80mm;height:80mm;border-radius:50%;left:-26mm;bottom:-46mm;
  background:radial-gradient(circle,rgba(0,103,200,.40),rgba(0,103,200,0) 68%)}
.blk-quote .mark{
  position:relative;font-family:"Instrument Serif",Georgia,serif;font-size:34pt;line-height:.6;
  color:var(--accent);display:block;margin-bottom:4mm;
}
.blk-quote q{
  position:relative;quotes:none;display:block;font-size:17pt;line-height:1.34;font-weight:600;
  letter-spacing:-.018em;color:#fff;max-width:130mm;margin:0 auto;
}
.blk-quote .who{
  position:relative;margin-top:5mm;font-size:6.4pt;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.62);
}

/* -- gallery -- */
.blk-galhead h2{
  margin:0 0 3mm;font-size:26pt;font-weight:800;letter-spacing:-.03em;line-height:1.04;color:var(--ink);
}
.blk-galhead .intro{max-width:120mm}
.blk-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}
.blk-gal .frame{aspect-ratio:1}
.blk-gal .cap{padding:8mm 3mm 2.8mm;font-size:5.9pt;letter-spacing:.09em}

/* -- stats -- */
.blk-stats{display:grid;gap:5mm}
.stat{
  border-radius:3mm;background:var(--paper-2);padding:5.5mm 5mm;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 .25mm var(--hair);
}
.stat .v{font-size:23pt;font-weight:800;letter-spacing:-.035em;color:var(--c);line-height:1}
.stat .l{
  margin-top:2.4mm;font-size:6.1pt;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--slate-2);line-height:1.5;
}

/* ============================================================================
   6.  CLOSING PAGE
   ==========================================================================*/
.paper.closing{
  background:
    radial-gradient(110% 70% at 104% 96%,rgba(212,19,103,.26) 0%,rgba(212,19,103,0) 55%),
    radial-gradient(90% 60% at -8% 4%,rgba(0,103,200,.30) 0%,rgba(0,103,200,0) 58%),
    linear-gradient(200deg,var(--deep) 0%,var(--deep2) 55%,var(--deep3) 100%);
  color:#fff;
}
.closing .arc{position:absolute;border:.3mm solid rgba(255,255,255,.09);border-radius:50%}
.closing .arc.b1{width:210mm;height:210mm;left:-96mm;top:-70mm}
.closing .arc.b2{width:140mm;height:140mm;right:-58mm;bottom:24mm;border-color:rgba(255,255,255,.07)}
.closing .inner{position:absolute;inset:0;padding:13mm var(--mx) 22mm;display:flex;flex-direction:column}
.closing .pg-head{border-bottom-color:rgba(255,255,255,.16);position:static;padding:0 0 4mm;height:auto;margin-bottom:11mm}
.closing .pg-head .hl{color:rgba(255,255,255,.6)}
.closing .pg-head .hl b{color:#fff}
.closing .sechead .kk{color:rgba(255,255,255,.6)}
.closing h2{
  margin:0 0 5mm;font-size:28pt;font-weight:800;line-height:1.06;letter-spacing:-.024em;color:#fff;max-width:150mm;
}
.closing .rtxt p{color:rgba(255,255,255,.78);font-size:10.4pt}
.closing .credits{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:10mm}
.closing .credit{
  border-radius:2.6mm;padding:4.5mm;background:rgba(255,255,255,.055);
  box-shadow:inset 0 0 0 .25mm rgba(255,255,255,.16);
}
.closing .credit .cl{
  font-size:6pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  margin-bottom:2.6mm;
}
.closing .credit .cv{font-size:8pt;line-height:1.55;color:rgba(255,255,255,.9);font-weight:500}
.closing .credit .cv span{display:block;color:rgba(255,255,255,.55);font-weight:400}

.closing .statement{
  margin-top:9mm;position:relative;border-radius:3.6mm;overflow:hidden;height:56mm;
  box-shadow:inset 0 0 0 .3mm rgba(255,255,255,.14);
}
.closing .statement img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.closing .statement .veil{position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(9,17,40,.93) 6%,rgba(9,17,40,.72) 52%,rgba(9,17,40,.5) 100%)}
.closing .statement .st{position:absolute;inset:0;padding:8mm 9mm;display:flex;flex-direction:column;justify-content:center}
.closing .statement .st h3{margin:0;font-size:14pt;font-weight:700;line-height:1.32;letter-spacing:-.02em;color:#fff;max-width:120mm}
.closing .statement .st .m{
  margin-top:4mm;font-size:6.2pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6);
}
.closing .tags{
  margin-top:auto;text-align:center;font-size:6.6pt;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(255,255,255,.55);padding-bottom:6mm;
}
.closing .endlock{display:flex;justify-content:center}
.closing .endrule{height:.5mm;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:8mm}
.closing .pg-foot{border-top-color:rgba(255,255,255,.16);color:rgba(255,255,255,.5)}


/* ---- layout glue ------------------------------------------------------- */
.chooser .gfx i{height:100%}
.main.preview .col-edit{display:none}
.main:not(.preview) .col-prev{
  position:fixed;left:-12000px;top:0;width:980px;height:1400px;
  overflow:hidden;pointer-events:none;opacity:0;
}
.blk-gal + .blk-gal{margin-top:5mm}
.blk-galhead + .blk-gal{margin-top:6mm}
.blk-feat + .blk-sec,.blk-quote + .blk-sec{margin-top:10mm}

/* ============================================================================
   6b. RESPONSIVE  —  tablet, then single-pane phone layout
   ==========================================================================*/

/* Any touch / no-hover device: row actions can never be revealed by hover. */
@media (hover:none){
  .note-row .row-acts{opacity:1}
}

/* --- tablet: tighten the two fixed columns ----------------------------- */
@media (max-width:1080px){
  .main{grid-template-columns:180px 232px 1fr}
  .sheet{padding:30px 26px 110px}
  .chooser{grid-template-columns:repeat(2,1fr)}
}

/* --- phone / small tablet: one pane at a time -------------------------- */
@media (max-width:760px){
  .mnav{display:flex}

  .main,.main.preview{grid-template-columns:1fr}
  .col-side,.col-list{border-right:0}
  .col-side{padding:8px 8px 22px}

  /* Only the active pane is on screen.  .col-prev keeps its existing
     off-screen/preview behaviour — it is never part of the pane rotation. */
  body[data-pane="side"] .col-list,
  body[data-pane="side"] .col-edit,
  body[data-pane="list"] .col-side,
  body[data-pane="list"] .col-edit,
  body[data-pane="edit"] .col-side,
  body[data-pane="edit"] .col-list{display:none !important}
  /* Preview owns the whole width; the mode toggle is the way back.
     .mnav is hidden there via the global .hidden class, set in setMode(). */
  .main.preview .col-side{display:none !important}

  /* toolbar: drop the mac chrome, keep every action reachable.  The title is
     the only elastic item, so it absorbs the slack and truncates when tight;
     overflow-x is the last-resort escape hatch on very small phones. */
  .toolbar{height:48px;gap:7px;padding:0 9px;overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .lights{display:none}
  .tb-title{font-size:13px;flex:1 1 0}
  .tb-title small{display:none}
  .tb-spacer{display:none}
  .warnchip{display:none}
  .tbtn{padding:0 9px}
  .tbtn .lbl{display:none}
  .tbtn.primary{padding:0 11px}
  .tbtn.primary .lbl{display:inline}
  .seg button{padding:4px 9px;font-size:12px}
  .tb-zoom button{width:23px;height:23px}
  .tb-zoom span{min-width:32px;font-size:11px}

  /* the pane bar already names the folder — the sidebar heading and the list
     heading would both just repeat it */
  .side-h{display:none}
  .list-top{padding:7px 10px;border-bottom:0;justify-content:flex-end}
  .list-top h2{display:none}
  .list-add{width:30px;height:30px}

  /* editor sheet */
  .sheet{padding:18px 15px calc(96px + env(safe-area-inset-bottom))}
  .sheet h1{font-size:21px}
  .frow,.frow.three{grid-template-columns:1fr}
  .gal-grid{grid-template-columns:repeat(2,1fr)}
  .rep-row{flex-wrap:wrap}
  .rep-row .fld{flex:1 1 140px}
  .logo-item{gap:10px;padding:9px 10px}
  .logo-item .prev{width:72px;height:38px;flex:0 0 72px}

  /* 16px keeps iOS Safari from zooming the viewport on focus */
  .fld,.fld.mono-up{font-size:16px}
  .fld.big{font-size:18px}

  /* preview canvas */
  #pages{padding:14px 10px calc(44px + env(safe-area-inset-bottom))}
  .prev-warn{max-width:100%}
}

/* Below this the "Export PDF" wordmark is the cheapest thing to give up —
   it sits beside Open and Save, which are already icon-only. */
@media (max-width:480px){
  .tbtn.primary{padding:0 9px}
  .tbtn.primary .lbl{display:none}
}

/* --- very narrow phones ------------------------------------------------ */
@media (max-width:360px){
  .tb-title{font-size:12.5px;gap:7px}
  .toolbar{gap:4px;padding:0 6px}
  .tbtn{padding:0 7px}
  .seg button{padding:4px 7px;font-size:11.5px}
  .tb-zoom button{width:21px;height:21px}
  .tb-zoom span{min-width:0;padding:0 1px}
}

/* ============================================================================
   7.  PRINT
   ==========================================================================*/
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .app{position:static;display:block}
  .toolbar,.col-side,.col-list,.col-edit,.mask,.toast,.pagemark,.prev-warn{display:none !important}
  .main{display:block}
  .col-prev,.main:not(.preview) .col-prev{position:static !important;left:auto !important;top:auto !important;
    width:auto !important;height:auto !important;opacity:1 !important;overflow:visible !important;
    background:#fff;background-image:none;display:block;pointer-events:auto}
  #pages{padding:0;display:block}
  .paper{
    box-shadow:none !important;transform:none !important;margin:0 !important;
    width:210mm;height:297mm;break-after:page;page-break-after:always;
  }
  .paper:last-child{break-after:auto;page-break-after:auto}
}

/* ============================================================================

   ==========================================================================*/
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = ()=> Math.random().toString(36).slice(2,10);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const paras = t => String(t||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
const nl = t => esc(t).replace(/\n/g,'<br>');

/* *accent* -> coloured span, newlines -> line breaks */
function titleHTML(t){
  return esc(t||'').replace(/\n/g,'<br>').replace(/\*([^*]+)\*/g,'<span class="ac">$1</span>');
}
function getPath(o,p){ return p.split('.').reduce((a,k)=> a==null?a:a[k], o); }
function setPath(o,p,v){
  const k = p.split('.'); const last = k.pop();
  let cur = o; for(const s of k) cur = cur[s];
  cur[last] = v;
}
function toast(msg){
  $$('.toast').forEach(t=>t.remove());
  const d = document.createElement('div'); d.className='toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2400);
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* ---- image ingest: downscale + compress ------------------------------- */
async function ingest(file, opts){
  opts = opts || {};
  const max = opts.max || 1700;
  const keepAlpha = /png|svg|webp/i.test(file.type) && opts.alpha !== false;
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{
      const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;
    });
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth*scale));
    const h = Math.max(1, Math.round(img.naturalHeight*scale));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img,0,0,w,h);
    let alpha = keepAlpha;
    if(alpha){                       /* a PNG with no transparency is cheaper as a JPEG */
      alpha = false;
      try{
        const px = ctx.getImageData(0,0,w,h).data;
        for(let i=3;i<px.length;i+=4){ if(px[i]<250){ alpha = true; break; } }
      }catch(err){ alpha = true; }
    }
    const data = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86);
    return { data, w, h, pos:'center' };
  } finally { URL.revokeObjectURL(url); }
}
function pickFiles(input){
  return new Promise(res=>{
    input.value=''; input.onchange = ()=> res(Array.from(input.files||[])); input.click();
  });
}

/* ---- persistence ------------------------------------------------------
   IndexedDB when the page is served over http(s); localStorage when the
   file is opened straight from disk (Chrome blocks IDB on file:// URLs).
   localStorage cannot hold a full set of photographs, so in that mode the
   auto-save quietly drops to text-only and the user is told once.        */
function stripPhotos(doc){
  const d = JSON.parse(JSON.stringify(doc));
  [d.cover, d.closing].forEach(o=>{ if(o) o.image = null; });
  (d.sections||[]).forEach(o=>{ o.image = null; });
  if(d.gallery) d.gallery.items = [];
  (d.logos && d.logos.added || []).forEach(l=>{ l.data = ''; });
  return d;
}
const store = {
  mode:null, _db:null, warned:false,
  async init(){
    if(this.mode) return this.mode;
    let db = null;
    try{
      db = await Promise.race([
        new Promise((res,rej)=>{
          let r; try{ r = indexedDB.open('rotaract-report-builder',1); }catch(err){ return rej(err); }
          r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore('kv'); }catch(err){} };
          r.onsuccess = ()=> res(r.result);
          r.onerror   = ()=> rej(r.error || new Error('idb'));
          r.onblocked = ()=> rej(new Error('blocked'));
        }),
        new Promise((_,rej)=> setTimeout(()=> rej(new Error('timeout')), 1200))
      ]);
    }catch(err){ db = null; }
    if(db){ this._db = db; this.mode = 'idb'; return this.mode; }
    try{ localStorage.setItem('rrb.probe','1'); localStorage.removeItem('rrb.probe'); this.mode = 'ls'; }
    catch(err){ this.mode = 'none'; }
    return this.mode;
  },
  async get(k){
    await this.init();
    if(this.mode==='idb') return new Promise(res=>{
      try{
        const t = this._db.transaction('kv','readonly');
        const q = t.objectStore('kv').get(k);
        q.onsuccess = ()=> res(q.result); q.onerror = ()=> res(null);
      }catch(err){ res(null); }
    });
    if(this.mode==='ls'){
      try{ const v = localStorage.getItem('rrb.'+k); return v ? JSON.parse(v) : null; }catch(err){ return null; }
    }
    return null;
  },
  async set(k,v){
    await this.init();
    if(this.mode==='idb') return new Promise(res=>{
      try{
        const t = this._db.transaction('kv','readwrite');
        t.objectStore('kv').put(v,k);
        t.oncomplete = ()=> res('full'); t.onerror = ()=> res(false);
      }catch(err){ res(false); }
    });
    if(this.mode==='ls'){
      try{ localStorage.setItem('rrb.'+k, JSON.stringify(v)); return 'full'; }
      catch(err){
        try{ localStorage.setItem('rrb.'+k, JSON.stringify(stripPhotos(v))); return 'text-only'; }
        catch(err2){ return false; }
      }
    }
    return false;
  }
};

/* ============================================================================
   NUMBERING  —  numbered items run: sections → gallery → closing
   ==========================================================================*/
const NUMBERED = s => s.layout === 'right' || s.layout === 'left';
function numbering(){
  const out = { bySec:{}, list:[] };
  let n = 0;
  S.sections.forEach(sec=>{
    if(NUMBERED(sec)){ n++; out.bySec[sec.id]=n; out.list.push({no:n, kicker: sec.kicker||'SECTION'}); }
  });
  n++; out.gallery = n; out.list.push({no:n, kicker: S.gallery.kicker||'IN PICTURES'});
  n++; out.closing = n; out.list.push({no:n, kicker: S.closing.kicker||'CLOSING'});
  return out;
}
/* split a list into up to `k` near-even contiguous groups */
function chunkEven(arr,k){
  const out=[]; const n=arr.length; if(!n) return out;
  const g = Math.min(k,n); const base = Math.floor(n/g); let extra = n%g; let i=0;
  for(let x=0;x<g;x++){ const size = base + (extra-->0?1:0); out.push(arr.slice(i,i+size)); i+=size; }
  return out;
}

/* ============================================================================
   SAVE / LOAD
   ==========================================================================*/
let dirty = false;              /* changed since the last Save to a file */
const persist = debounce(async ()=>{
  let r = false;
  try{ r = await store.set('doc', JSON.parse(JSON.stringify(S))); }catch(e){}
  if(r === 'text-only' && !store.warned){
    store.warned = true;
    const chip = $('#warnChip'); if(chip) chip.classList.remove('hidden');
    toast('Auto-save is text-only here — use Save to keep your photos');
  }
}, 500);
const rebuild = debounce(()=>{ buildReport(); }, 320);
function touch(opts){
  opts = opts||{};
  dirty = true;
  persist();
  rebuild();
  $('#tbMeta').textContent = '— ' + (S.meta.shortTitle || S.meta.eventName || 'Untitled');
  if(opts.list !== false) renderList();
  renderMnav();
}
function download(name, text, type){
  const b = new Blob([text], {type: type||'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function saveFile(){
  const name = (S.meta.shortTitle||'rotaract-report').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  download(name + '.rotaract', JSON.stringify(S), 'application/json');
  dirty = false;
  toast('Report file saved to Downloads');
}
async function openFile(){
  const [f] = await pickFiles($('#fileJson')); if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    if(!obj || !obj.meta || !obj.sections) throw new Error('bad');
    S = Object.assign(blankState(), obj);
    S.logos = S.logos || {added:[]}; S.logos.added = S.logos.added || [];
    ui.folder='cover'; ui.sel={};
    renderAll(); touch(); dirty = false; toast('Opened \u201C' + f.name + '\u201D');
  }catch(e){ toast('That file could not be read'); }
}

function notesFor(f){
  const nb = numbering();
  switch(f){
    case 'cover':    return [{id:'cover', title:'Cover page', sub:S.cover.deck||'Title, standfirst, byline and hero photo', thumb:S.cover.image}];
    case 'overview': return [{id:'overview', title:'Opening note', sub:S.overview.text||'The paragraph that opens the report'}];
    case 'sections': return S.sections.map(s=>({
        id:s.id,
        num: nb.bySec[s.id] ? pad2(nb.bySec[s.id]) : (s.layout==='quote'?'“”':'▣'),
        title: s.layout==='quote' ? (s.quote||'Pull quote')
             : s.layout==='feature' ? (s.caption||'Full-width photo')
             : (s.headline ? s.headline.replace(/\n/g,' ') : (s.kicker||'Untitled section')),
        sub: s.layout==='quote' ? (s.quoteWho||'Pull quote')
           : s.layout==='feature' ? 'Full-width photo'
           : (s.kicker||'') + (s.body? ' · '+s.body.slice(0,60) : ''),
        thumb: s.image, section:true }));
    case 'gallery':  return [
        {id:'g-intro',  title:'Gallery heading', sub:S.gallery.intro||'Kicker, title and intro line'},
        {id:'g-photos', title:'Photos', sub:S.gallery.items.length+' photo'+(S.gallery.items.length===1?'':'s')+' in the grid', thumb:S.gallery.items[0]&&S.gallery.items[0].image},
        {id:'g-stats',  title:'Numbers', sub:S.gallery.stats.filter(x=>x.v).map(x=>x.v).join(' · ')||'The stat cards under the grid'}];
    case 'closing':  return [
        {id:'c-words',     title:'Closing words', sub:S.closing.headline?S.closing.headline.replace(/\n/g,' '):'Headline and final paragraph'},
        {id:'c-credits',   title:'Credits',       sub:S.closing.credits.map(c=>c.l).filter(Boolean).join(' · ')||'Who made it happen'},
        {id:'c-statement', title:'Final statement', sub:S.closing.statement?S.closing.statement.replace(/\n/g,' '):'The closing image card', thumb:S.closing.image}];
    case 'details':  return [{id:'details', title:'Report details', sub:S.meta.eventName+' · '+S.meta.eventDate}];
    case 'logos':    return LOCKED_LOGOS.map(l=>({id:l.id, title:l.name, sub:l.role, locked:true, logo:l}))
                       .concat(S.logos.added.map(l=>({id:l.id, title:l.name||'Added logo', sub:'Added by you · removable', logo:l})));
  }
  return [];
}

/* ============================================================================
   BINDING
   ==========================================================================*/
function autogrow(el){ el.style.height='auto'; el.style.height = (el.scrollHeight+2)+'px'; }
function bind(root){
  $$('[data-bind]',root).forEach(el=>{
    const path = el.dataset.bind;
    if(el.tagName==='TEXTAREA') autogrow(el);
    el.addEventListener('input', ()=>{
      setPath(S, path, el.value);
      if(el.tagName==='TEXTAREA') autogrow(el);
      touch();
    });
  });
  $$('[data-check]',root).forEach(el=>{
    el.addEventListener('change', ()=>{ setPath(S, el.dataset.check, el.checked); touch(); });
  });
  $$('.drop[data-drop], .imgcard[data-drop], .drop[data-galadd]',root).forEach(el=>{
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('over'));
    el.addEventListener('drop', async e=>{
      e.preventDefault(); el.classList.remove('over');
      const files = Array.from(e.dataTransfer.files||[]).filter(f=>/^image\//.test(f.type));
      if(!files.length) return;
      if(el.hasAttribute('data-galadd')) await addGallery(files);
      else { setPath(S, el.dataset.drop, await ingest(files[0], {alpha:false})); renderEditor(); touch(); }
    });
  });
}

/* ============================================================================
   ACTIONS
   ==========================================================================*/
function renderAll(){ renderSide(); renderList(); renderEditor(); renderMnav(); }
function select(folder, noteId){
  ui.folder = folder; if(noteId) ui.sel[folder] = noteId;
  renderSide(); renderList(); renderEditor(); renderMnav();
}

/* ============================================================================
   MOBILE PANES  —  under 760px only one column is on screen at a time, so the
   three desktop columns become a side → list → edit drill-down.
   ==========================================================================*/
const PANES = ['side','list','edit'];

function goPane(p){
  if(PANES.indexOf(p) < 0) p = 'side';
  ui.pane = p;
  document.body.dataset.pane = p;
  renderMnav();
}
function renderMnav(){
  const back = $('#mnavBack'), lbl = $('#mnavBackLbl'), title = $('#mnavTitle');
  if(!back) return;
  const folder = FOLDERS.find(f=>f.id===ui.folder);
  if(ui.pane === 'side'){
    back.hidden = true;
    title.textContent = 'Report';
  } else if(ui.pane === 'list'){
    back.hidden = false; lbl.textContent = 'Report';
    title.textContent = folder ? folder.label : 'Report';
  } else {
    const note = currentNote();
    /* the label has to name where Back actually lands, and a solo folder's
       editor steps straight over the list back to the sidebar */
    const up = soloFolder(ui.folder) || !folder ? 'Report' : folder.label;
    back.hidden = false; lbl.textContent = up;
    title.textContent = note ? note.title : (folder ? folder.label : '');
  }
}
/* Cover, Opening and Report details hold a single note, so their list pane
   would be one row echoing the folder name — step over it in both directions. */
function soloFolder(f){ return notesFor(f).length <= 1; }
function paneBack(){
  goPane(ui.pane === 'edit' && !soloFolder(ui.folder) ? 'list' : 'side');
}
async function addGallery(files){
  for(const f of files){
    if(!/^image\//.test(f.type)) continue;
    S.gallery.items.push({ id:uid(), image: await ingest(f,{alpha:false}), caption:'' });
  }
  renderEditor(); renderSide(); touch();
}
async function addLogo(replaceId){
  const [f] = await pickFiles($('#fileLogo')); if(!f) return;
  const img = await ingest(f,{max:900});
  if(replaceId){
    const l = S.logos.added.find(x=>x.id===replaceId); if(l) l.data = img.data;
  }else{
    const l = { id:uid(), name: f.name.replace(/\.[^.]+$/,''), data: img.data };
    S.logos.added.push(l); ui.sel.logos = l.id;
  }
  renderAll(); touch();
}

document.addEventListener('click', async e=>{
  const t = e.target;
  const hit = s => t.closest(s);
  let el2;

  if(t.closest('#mnavBack')){ paneBack(); return; }
  if((el2 = hit('[data-mode]'))){ setMode(el2.dataset.mode); return; }

  /* row actions sit inside the row, so they are matched before the row */
  if((el2 = hit('[data-move]'))){
    const parts = el2.dataset.move.split('|');
    const i = S.sections.findIndex(x=>x.id===parts[0]); const j = i + Number(parts[1]);
    if(i>=0 && j>=0 && j<S.sections.length){
      const moved = S.sections.splice(i,1)[0]; S.sections.splice(j,0,moved);
      ui.folder='sections'; ui.sel.sections = parts[0]; renderAll(); touch();
    }
    return;
  }
  if((el2 = hit('[data-del]'))){
    const id = el2.dataset.del;
    if(S.sections.length<=1){ toast('A report needs at least one section'); return; }
    S.sections = S.sections.filter(x=>x.id!==id);
    if(ui.sel.sections===id) delete ui.sel.sections;
    renderAll(); touch(); return;
  }
  if((el2 = hit('[data-dellogo]'))){
    const id = el2.dataset.dellogo;
    S.logos.added = S.logos.added.filter(l=>l.id!==id);
    if(ui.sel.logos===id) delete ui.sel.logos;
    renderAll(); touch(); return;
  }
  if((el2 = hit('[data-add]'))){
    if(el2.dataset.add==='sections'){
      const sec = blankSection('NEW SECTION','right');
      S.sections.push(sec); ui.sel.sections = sec.id; renderAll(); touch(); goPane('edit');
    } else if(el2.dataset.add==='logos'){ addLogo(); }
    return;
  }

  if((el2 = hit('[data-folder]'))){
    const f = el2.dataset.folder;
    select(f); goPane(soloFolder(f) ? 'edit' : 'list'); return;
  }
  if((el2 = hit('[data-note]'))  ){ select(ui.folder, el2.dataset.note); goPane('edit'); return; }

  if((el2 = hit('[data-act]'))){
    const a = el2.dataset.act;
    if(a==='example'){ S = exampleState(); ui.folder='cover'; ui.sel={}; renderAll(); touch(); goPane('side'); toast('Example report loaded'); }
    if(a==='blank'){
      if(!confirm('Clear everything and start a blank report? Your photos will be removed too.')) return;
      S = blankState(); ui.folder='cover'; ui.sel={}; renderAll(); touch(); goPane('side'); toast('Blank report started');
    }
    return;
  }

  if((el2 = hit('[data-layout]'))){
    const [i,lay] = el2.dataset.layout.split('|');
    S.sections[Number(i)].layout = lay; renderEditor(); touch(); return;
  }
  if((el2 = hit('[data-theme]'))){ S.meta.theme = el2.dataset.theme; renderEditor(); touch(); return; }

  /* images */
  if((el2 = hit('.drop[data-drop]')) || (el2 = hit('[data-imgrep]'))){
    const path = el2.dataset.drop || el2.dataset.imgrep;
    const [f] = await pickFiles($('#fileImg')); if(!f) return;
    setPath(S, path, await ingest(f,{alpha:false}));
    renderEditor(); renderList(); touch(); return;
  }
  if((el2 = hit('[data-imgdel]'))){ setPath(S, el2.dataset.imgdel, null); renderEditor(); renderList(); touch(); return; }
  if((el2 = hit('[data-galadd]'))){ const fs = await pickFiles($('#fileImg')); if(fs.length) addGallery(fs); return; }
  if((el2 = hit('[data-galdel]'))){ S.gallery.items.splice(Number(el2.dataset.galdel),1); renderEditor(); renderSide(); touch(); return; }

  /* repeaters */
  if(hit('[data-statadd]')){ if(S.gallery.stats.length<6){ S.gallery.stats.push({v:'',l:''}); renderEditor(); touch(); } return; }
  if((el2 = hit('[data-statdel]'))){ S.gallery.stats.splice(Number(el2.dataset.statdel),1); renderEditor(); touch(); return; }
  if(hit('[data-creadd]')){ if(S.closing.credits.length<5){ S.closing.credits.push({l:'',a:'',b:''}); renderEditor(); touch(); } return; }
  if((el2 = hit('[data-credel]'))){ S.closing.credits.splice(Number(el2.dataset.credel),1); renderEditor(); touch(); return; }

  /* logos */
  if(hit('[data-logoadd]')){ addLogo(); return; }
  if((el2 = hit('[data-logorep]'))){ addLogo(el2.dataset.logorep); return; }

  /* import a text file into a field */
  if((el2 = hit('[data-txt]'))){
    const path = el2.dataset.txt;
    const [f] = await pickFiles($('#fileTxt')); if(!f) return;
    const txt = (await f.text()).replace(/\r\n/g,'\n').trim();
    setPath(S, path, txt); renderEditor(); touch(); toast('Text imported'); return;
  }

  if(t.id==='btnSave'){ saveFile(); return; }
  if(t.closest('#btnSave')){ saveFile(); return; }
  if(t.closest('#btnOpen')){ openFile(); return; }
  if(t.closest('#btnPdf')) { exportPDF(); return; }
  if(t.closest('#zIn'))  { ui.zoomAuto=false; ui.zoom=Math.min(1.6, ui.zoom+0.1); applyZoom(); return; }
  if(t.closest('#zOut')) { ui.zoomAuto=false; ui.zoom=Math.max(0.25, ui.zoom-0.1); applyZoom(); return; }
});

document.addEventListener('change', e=>{
  const el2 = e.target;
  if(el2.dataset && el2.dataset.imgpos){
    const im = getPath(S, el2.dataset.imgpos); if(im){ im.pos = el2.value; renderEditor(); touch(); }
  }
  if(el2.dataset && el2.dataset.galpos){
    const it = S.gallery.items[Number(el2.dataset.galpos)]; if(it){ it.image.pos = el2.value; renderEditor(); touch(); }
  }
});

function setMode(m){
  ui.mode = m;
  $('#main').classList.toggle('preview', m==='preview');
  $$('#modeSeg button').forEach(b=> b.classList.toggle('on', b.dataset.mode===m));
  $('#zoomBox').style.display = m==='preview' ? 'flex' : 'none';
  /* preview takes the whole width on a phone, so the drill-down bar steps aside */
  $('#mnav').classList.toggle('hidden', m==='preview');
  if(m==='preview'){ ui.zoomAuto = true; buildReport(); }
}

/* ============================================================================
   REPORT RENDERING
   ==========================================================================*/
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function chunk(a,n){ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; }
const themeClass = ()=> 't-'+(S.meta.theme||'royal');

function capHTML(c){ return c && c.trim() ? '<div class="cap">'+nl(c)+'</div>' : ''; }
function frame(im, cap, ratio, cls){
  const st = ratio ? ' style="aspect-ratio:'+ratio+'"' : '';
  if(!im) return '<div class="frame ph '+(cls||'')+'"'+st+'><div class="ph-in">'+svg(IC.photo)+'<span>Photograph</span></div>'+capHTML(cap)+'</div>';
  return '<div class="frame '+(cls||'')+'"'+st+'><img src="'+im.data+'" style="object-position:center '+(im.pos||'center')+'">'+capHTML(cap)+'</div>';
}
/* lock-up.  kind: 'head' (light page) | 'cover' (dark, compact) | 'big' (dark, large) */
function lockupHTML(kind){
  const onDark = kind !== 'head';
  const cls = kind==='head' ? 'lock--head' : kind==='cover' ? 'lock--cover' : 'lock--big';
  const base = kind==='head' ? 7 : kind==='cover' ? 10.5 : 12.5;
  const scale = Math.max(.58, 1 - Math.max(0, S.logos.added.length - 2) * 0.15);
  const items = LOCKED_LOGOS.map(l=>{
    const src = kind==='big' ? l.onDark
              : onDark ? (l.compactDark || l.onDark)
              : (l.compactLight || l.onLight);
    const k = kind==='big' ? (l.kBig||l.k||1) : (l.k||1);
    return '<img src="'+src+'" style="--k:'+k+'" alt="'+esc(l.name)+'">';
  });
  S.logos.added.forEach(l=>{
    items.push(onDark ? '<span class="chip"><img src="'+l.data+'" alt="'+esc(l.name||'')+'"></span>'
                      : '<img src="'+l.data+'" alt="'+esc(l.name||'')+'">');
  });
  const st = scale < 1 ? ' style="--lh:'+(base*scale).toFixed(2)+'mm"' : '';
  return '<div class="lock '+cls+(onDark?' dark':'')+'"'+st+'>'+items.join('<span class="sep"></span>')+'</div>';
}

function tocHTML(nb){
  const groups = chunkEven(nb.list, 4);
  if(!groups.length) return '';
  return '<div class="toc">'+groups.map(g=>{
    const nums = g.length>1 ? pad2(g[0].no)+' — '+pad2(g[g.length-1].no) : pad2(g[0].no);
    return '<div class="it"><div class="n">'+esc(nums)+'</div><div class="l">'+esc(g.map(x=>x.kicker).join(' & '))+'</div></div>';
  }).join('')+'</div>';
}

function coverPage(nb){
  const c = S.cover, m = S.meta;
  const by = [];
  if(c.wName) by.push('<span>Written by <b>'+esc(c.wName)+'</b>'+(c.wRole?' '+esc(c.wRole):'')+'</span>');
  if(c.eName) by.push('<span>Edited by <b>'+esc(c.eName)+'</b>'+(c.eRole?' '+esc(c.eRole):'')+'</span>');
  const hero = c.image
    ? '<img src="'+c.image.data+'" style="object-position:center '+(c.image.pos||'center')+'">'
    : '<div style="position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);font-size:6.6pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase">Hero photograph</div>';
  return el('<div class="paper cover '+themeClass()+'">'+
    '<div class="arc a1"></div><div class="arc a2"></div><div class="arc a3"></div><div class="grain"></div>'+
    '<div class="inner">'+
      '<div class="cover-lock">'+lockupHTML('cover')+'</div>'+
      '<div class="eyebrow">'+esc(m.eventName)+' <i>·</i> '+esc(m.eventDate)+' <i>·</i> '+esc(m.department)+'</div>'+
      '<h1>'+titleHTML(c.title)+'</h1>'+
      (c.deck? '<p class="deck">'+nl(c.deck)+'</p>' : '')+
      (by.length? '<div class="byline">'+by.join('<span class="v"></span>')+'</div>' : '')+
      (c.toc? tocHTML(nb) : '')+
      '<div class="hero">'+hero+capHTML(c.caption)+'</div>'+
    '</div>'+
    '<div class="cover-foot"><span><b>'+esc(m.club)+'</b> · '+esc(m.district)+'</span><span>'+esc(m.hashtags)+'</span></div>'+
  '</div>');
}

function contentPage(){
  const m = S.meta;
  return el('<div class="paper '+themeClass()+'">'+
    '<div class="pg-head"><span class="hl">'+esc(m.eventName)+' <b>·</b> '+esc(m.eventDate)+'</span>'+lockupHTML('head')+'</div>'+
    '<div class="pg-body"></div>'+
    '<div class="pg-foot"><span>'+esc(m.shortTitle)+'</span><span class="pno"></span><span>'+esc(m.department)+'</span></div>'+
  '</div>');
}

/* ---- blocks ----------------------------------------------------------- */
const secHead = (no,kk)=> '<div class="sechead">'+(no?'<span class="no">'+pad2(no)+'</span><span class="rule"></span>':'')+
  '<span class="kk">'+esc(kk||'')+'</span></div>';

function leadBlock(){
  return '<div class="blk blk-lead"><div class="glow"></div><div class="arcl"></div>'+
    '<div class="kt">'+esc(S.meta.eventName)+'</div>'+
    paras(S.overview.text).map(p=>'<p>'+nl(p)+'</p>').join('')+'</div>';
}
function secBlock(sec,no,ps){
  return '<div class="blk blk-sec '+sec.layout+'">'+
    '<div class="sec">'+secHead(no, sec.kicker)+
      '<h2>'+nl(sec.headline)+'</h2>'+
      '<div class="rtxt">'+ps.map(p=>'<p>'+nl(p)+'</p>').join('')+'</div>'+
    '</div>'+
    '<div class="figwrap">'+frame(sec.image, sec.caption, '4/3')+'</div>'+
  '</div>';
}
const contBlock = ps => '<div class="blk blk-cont rtxt">'+ps.map(p=>'<p>'+nl(p)+'</p>').join('')+'</div>';
function quoteBlock(sec){
  return '<div class="blk blk-quote"><div class="glow"></div>'+
    '<span class="mark">&ldquo;</span><q>'+nl(sec.quote)+'</q>'+
    (sec.quoteWho? '<div class="who">'+esc(sec.quoteWho)+'</div>':'')+'</div>';
}
function galHeadBlock(no){
  return '<div class="blk blk-galhead">'+secHead(no, S.gallery.kicker)+
    '<h2>'+nl(S.gallery.title)+'</h2>'+
    (S.gallery.intro? '<div class="rtxt intro"><p>'+nl(S.gallery.intro)+'</p></div>':'')+'</div>';
}
const galRowBlock = (row,r) => '<div class="blk blk-gal">'+row.map(it=>frame(it.image, it.caption, r||'1')).join('')+'</div>';
const galEmptyBlock = (r)=> '<div class="blk blk-gal">'+[0,1,2].map(()=>frame(null,'',r||'1')).join('')+'</div>';
const STATC = ['var(--cranberry)','var(--azure)','var(--gold)','var(--violet)','var(--royal)','#01A2A5'];
function statsBlock(list){
  return '<div class="blk blk-stats" style="grid-template-columns:repeat('+Math.min(list.length,4)+',1fr)">'+
    list.map((s,i)=>'<div class="stat" style="--c:'+STATC[i%STATC.length]+'">'+
      '<div class="v">'+esc(s.v)+'</div><div class="l">'+esc(s.l)+'</div></div>').join('')+'</div>';
}

function closingPage(no){
  const c = S.closing, m = S.meta;
  const creds = c.credits.filter(x=>x.l||x.a||x.b);
  const stmt = c.statement || c.image ? (
    '<div class="statement">'+
      (c.image? '<img src="'+c.image.data+'" style="object-position:center '+(c.image.pos||'center')+'">':'')+
      '<div class="veil"></div>'+
      '<div class="st"><h3>'+nl(c.statement)+'</h3>'+
      (c.statementMeta? '<div class="m">'+esc(c.statementMeta)+'</div>':'')+'</div>'+
    '</div>') : '';
  return el('<div class="paper closing '+themeClass()+'">'+
    '<div class="arc b1"></div><div class="arc b2"></div>'+
    '<div class="inner">'+
      '<div class="pg-head"><span class="hl">'+esc(m.eventName)+' <b>·</b> '+esc(m.eventDate)+'</span>'+lockupHTML('head')+'</div>'+
      secHead(no, c.kicker)+
      '<h2>'+nl(c.headline)+'</h2>'+
      '<div class="rtxt">'+paras(c.body).map(p=>'<p>'+nl(p)+'</p>').join('')+'</div>'+
      (creds.length? '<div class="credits">'+creds.map(x=>
        '<div class="credit"><div class="cl">'+esc(x.l)+'</div><div class="cv">'+esc(x.a)+
        (x.b?'<span>'+esc(x.b)+'</span>':'')+'</div></div>').join('')+'</div>' : '')+
      stmt+
      '<div class="tags">'+esc(m.hashtags)+'</div>'+
      '<div class="endrule"></div>'+
      '<div class="endlock">'+lockupHTML('big')+'</div>'+
      '<div class="pg-foot"><span>'+esc(m.institution)+'</span><span class="pno"></span><span>'+esc(m.department)+'</span></div>'+
    '</div>'+
  '</div>');
}
/* the closing page uses a light-artwork lock-up in its header on a dark ground —
   swap it for the dark-ground artwork after the markup is built */
function fixClosingHeader(page){
  const lock = page.querySelector('.pg-head .lock');
  if(!lock) return;
  const fresh = el(lockupHTML('cover'));
  fresh.classList.remove('lock--cover'); fresh.classList.add('lock--head');
  lock.replaceWith(fresh);
}

/* ---- flow engine ------------------------------------------------------- */
class Flow{
  constructor(host){ this.host=host; this.page=null; this.body=null; this.clipped=false; }
  newPage(){ const p = contentPage(); this.host.appendChild(p); this.page=p; this.body=p.querySelector('.pg-body'); }
  fits(){ return this.body.scrollHeight <= this.body.clientHeight + 1; }
  tryPush(node){
    if(!this.page) this.newPage();
    this.body.appendChild(node);
    if(this.fits()) return true;
    this.body.removeChild(node);
    if(this.body.children.length){
      this.newPage(); this.body.appendChild(node);
      if(this.fits()) return true;
      this.body.removeChild(node);
    }
    return false;
  }
  tryHere(node){                       /* only the page we are already on */
    if(!this.page) this.newPage();
    this.body.appendChild(node);
    if(this.fits()) return true;
    this.body.removeChild(node); return false;
  }
  push(node){ if(!this.tryPush(node)){ if(!this.page) this.newPage(); this.body.appendChild(node); this.clipped=true; } }
}
function placeSection(flow, sec, no){
  const ps = paras(sec.body);
  const mk = k => el(secBlock(sec, no, ps.slice(0, k)));
  let used = -1;
  /* seat it on the page already in progress — a short section is never split */
  if(flow.page && flow.body.children.length){
    const floor = ps.length >= 3 ? 2 : ps.length;
    for(let k = ps.length; k >= floor && used < 0; k--) if(flow.tryHere(mk(k))) used = k;
  }
  /* otherwise open a page and fill it as far as the text goes */
  if(used < 0) for(let k = ps.length; k >= 0 && used < 0; k--) if(flow.tryPush(mk(k))) used = k;
  if(used < 0){ flow.push(mk(0)); used = 0; }
  const rest = ps.slice(used);
  if(rest.length) placeContinuation(flow, rest);
}
/* whatever did not fit beside the photograph runs on in two columns,
   over as many pages as it takes */
function placeContinuation(flow, ps){
  let rest = ps.slice(), guard = 0;
  while(rest.length && guard++ < 300){
    let used = -1;
    for(let k = rest.length; k >= 1 && used < 0; k--) if(flow.tryHere(el(contBlock(rest.slice(0,k))))) used = k;
    if(used < 0) for(let k = rest.length; k >= 1 && used < 0; k--) if(flow.tryPush(el(contBlock(rest.slice(0,k))))) used = k;
    if(used < 0){ flow.push(el(contBlock(rest.slice(0,1)))); used = 1; }
    rest = rest.slice(used);
  }
}

/* The gallery opens its own page, exactly as the printed report does, and the
   tiles flatten just enough for the heading, every row and the numbers to sit
   together on it — so the stat cards never end up stranded on a page alone. */
function placeGallery(flow, nb, stats){
  const rows = S.gallery.items.length ? chunk(S.gallery.items, 3) : null;
  const build = r => {
    const nodes = [el(galHeadBlock(nb.gallery))];
    if(rows) rows.forEach(row=> nodes.push(el(galRowBlock(row, r))));
    else nodes.push(el(galEmptyBlock(r)));
    if(stats.length) nodes.push(el(statsBlock(stats)));
    return nodes;
  };
  if(!flow.page || flow.body.children.length) flow.newPage();
  for(const r of ['1','7/6','5/4','4/3','3/2']){
    flow.body.innerHTML = '';
    let ok = true;
    for(const node of build(r)){ if(!flow.tryHere(node)){ ok = false; break; } }
    if(ok) return;
  }
  flow.body.innerHTML = '';
  build('1').forEach(node=> flow.push(node));
}

/* a wide photo squeezes to a shallower crop rather than jumping to a new page */
function placeFeature(flow, sec){
  const mk = r => el('<div class="blk blk-feat">'+frame(sec.image, sec.caption, r)+'</div>');
  if(flow.tryHere(mk('16/9'))) return;
  if(flow.page && flow.body.children.length){
    if(flow.tryHere(mk('2/1')))  return;
    if(flow.tryHere(mk('21/9'))) return;
  }
  flow.push(mk('16/9'));
}

/* spread whatever room is left over the gaps, so pages read as composed */
function justifyPages(){
  $$('#pages .paper .pg-body').forEach(body=>{
    const kids = Array.from(body.children);
    if(kids.length < 2) return;
    const targets = kids.slice(1).filter(k=>
      !(k.classList.contains('blk-gal') && k.previousElementSibling.classList.contains('blk-gal')));
    if(!targets.length) return;
    const free = body.clientHeight - body.scrollHeight;
    if(free < 26) return;
    const add = Math.min(free/targets.length, 46);
    targets.forEach(k=>{
      k.style.marginTop = ((parseFloat(getComputedStyle(k).marginTop)||0) + add) + 'px';
    });
  });
}

/* ---- build ------------------------------------------------------------- */
let buildLock = false;
function buildReport(){
  if(buildLock) return; buildLock = true;
  const host = $('#pages');
  try{
    host.innerHTML = '';
    const nb = numbering();
    host.appendChild(coverPage(nb));

    const flow = new Flow(host);
    if((S.overview.text||'').trim()) flow.push(el(leadBlock()));
    S.sections.forEach(sec=>{
      if(sec.layout==='quote')        flow.push(el(quoteBlock(sec)));
      else if(sec.layout==='feature') placeFeature(flow, sec);
      else                            placeSection(flow, sec, nb.bySec[sec.id]);
    });
    const stats = S.gallery.stats.filter(s=> (s.v||'').trim() || (s.l||'').trim());
    placeGallery(flow, nb, stats);

    justifyPages();

    const cp = closingPage(nb.closing); host.appendChild(cp); fixClosingHeader(cp);

    /* page numbers + preview marks */
    const papers = $$('#pages .paper');
    papers.forEach((p,i)=>{ const n = p.querySelector('.pno'); if(n) n.textContent = pad2(i+1); });

    let warn = '';
    if(flow.clipped) warn = 'Some content is longer than a page and has been clipped. Shorten the body text of that section, or split it into two sections.';
    const ci = cp.querySelector('.inner');
    if(ci && ci.scrollHeight > ci.clientHeight + 2)
      warn = (warn?warn+' ':'') + 'The closing page is overfull — trim the closing paragraph or remove a credit card.';
    if(warn) host.insertAdjacentHTML('afterbegin','<div class="prev-warn">'+esc(warn)+'</div>');

    papers.forEach((p,i)=> p.insertAdjacentHTML('beforebegin',
      '<div class="pagemark">Page '+(i+1)+' of '+papers.length+'</div>'));

    applyZoom();
  } catch(err){
    host.insertAdjacentHTML('afterbegin',
      '<div class="prev-warn">The preview could not be drawn: '+esc(err && err.message || err)+
      '. Your text is safe — use Save to keep a copy.</div>');
  } finally { buildLock = false; }
}

function applyZoom(){
  const col = $('#prevCol');
  const natural = 210 * 96/25.4;
  const gutter = window.innerWidth <= 760 ? 20 : 56;
  const avail = Math.max(180, (ui.mode==='preview' ? col.clientWidth : 980) - gutter);
  if(ui.zoomAuto) ui.zoom = Math.max(.1, Math.min(1, avail/natural));
  const z = ui.zoom, shrink = 297 * 96/25.4 * (1-z);
  /* scale() leaves the untransformed box in flow, so pull the margins in by
     what the transform trimmed — otherwise a scaled page still reserves a
     full 210mm and the canvas scrolls sideways on a phone. */
  const sideways = natural * (1-z) / 2;
  $$('#pages .paper').forEach(p=>{
    p.style.transform = 'scale('+z+')';
    p.style.marginBottom = (22 - shrink)+'px';
    p.style.marginLeft = p.style.marginRight = (-sideways)+'px';
  });
  const lbl = $('#zLbl'); if(lbl) lbl.textContent = Math.round(z*100)+'%';
}
window.addEventListener('resize', debounce(()=>{ ui.zoomAuto = true; applyZoom(); }, 160));

/* ============================================================================
   EXPORT
   ==========================================================================*/
function exportPDF(){
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML =
    '<div class="modal"><h3>Save as PDF</h3>'+
    '<p>Your browser print dialog will open next. For the report to come out exactly as it looks in Preview, set these three things:</p>'+
    '<ol><li>Destination — <b>Save as PDF</b></li>'+
    '<li>Margins — <b>None</b></li>'+
    '<li>Options — tick <b>Background graphics</b></li></ol>'+
    '<div class="acts"><button class="tbtn" data-x="no">Cancel</button>'+
    '<button class="tbtn primary" data-x="go">Open print dialog</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', e=>{
    const b = e.target.closest('[data-x]'); if(!b && e.target!==m) return;
    m.remove();
    if(b && b.dataset.x==='go'){ buildReport(); setTimeout(()=>window.print(), 80); }
  });
}
window.addEventListener('beforeprint', ()=>{ if(!$('#pages').children.length) buildReport(); });
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='p'){ e.preventDefault(); exportPDF(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveFile(); }
});

/* ============================================================================
   BOOT
   ==========================================================================*/
(async function boot(){
  let saved = null;
  try{ saved = await store.get('doc'); }catch(e){}
  try{
    S = saved && saved.meta && saved.sections ? Object.assign(blankState(), saved) : exampleState();
  }catch(e){ S = exampleState(); }
  if(!S.logos) S.logos = {added:[]};
  if(!S.logos.added) S.logos.added = [];
  if(!S.gallery.stats) S.gallery.stats = [];
  $('#tbMeta').textContent = '— ' + (S.meta.shortTitle || S.meta.eventName);
  goPane(ui.pane);
  renderAll();
  buildReport();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ try{ buildReport(); }catch(e){} });
})();

/* a photo-heavy report cannot be auto-saved from a file:// page — say so */
window.addEventListener('beforeunload', e=>{
  const photos = !!(S.cover.image || S.closing.image || S.gallery.items.length ||
                    S.sections.some(x=>x.image));
  if(dirty && photos && store.mode !== 'idb'){ e.preventDefault(); e.returnValue = ''; }
});
</script>
